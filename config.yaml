# Repellent AI — Configuration file.

model_name: gemini-3-flash-preview
model_provider: google_genai
model_context_window: 1000000

# API key: literal, or exactly $VAR_NAME / ${VAR_NAME} to read that environment variable.
api_key: $GEMINI_API_KEY

# GitHub API token for issue/comment requests (same rules as api_key). 
github_token: $GITHUB_TOKEN
